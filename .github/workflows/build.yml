name: build

on:
  # this branch's own builds: app releases are tagged app-v* (v* belongs to the server)
  push:
    branches: [android-app, windows-app]
    # app-v*: one release per version with every platform's file (the APK is signed and
    # uploaded by hand); desktop-v*: only the bridge for desktop apps up to 0.3.6, which look there
    tags: ["app-v*", "desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          TUBEHAUS_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          TUBEHAUS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUBEHAUS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUBEHAUS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$TUBEHAUS_KEYSTORE" ] && unset TUBEHAUS_KEYSTORE
          ./gradlew --no-daemon :android:assembleRelease
          mv android/build/outputs/apk/release/*.apk "TubeHaus-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: TubeHaus-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: libmpv
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          # the plain x86_64 build, not -v3: that one needs AVX2 and won't start on older PCs
          $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' -and $_.name -notlike '*-v3-*' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z e mpv-dev.7z libmpv-2.dll -odesktop/resources/windows -y
          # libmpv needs vulkan-1.dll, which only comes with some graphics drivers: ship the official
          # Khronos loader (Apache-2.0) next to it, or mpv won't load on PCs without one
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip?u=' -OutFile vkrt.zip
          7z x vkrt.zip -ovkrt -y | Out-Null
          Copy-Item (Get-ChildItem vkrt -Recurse -Filter vulkan-1.dll | Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1).FullName desktop/resources/windows/
          Copy-Item (Get-ChildItem vkrt -Recurse -Filter VulkanRT-License.txt | Select-Object -First 1).FullName desktop/resources/windows/
          Get-ChildItem desktop/resources/windows
      - name: Build installer
        run: ./gradlew --no-daemon :desktop:packageReleaseMsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/build/compose/binaries/main-release/msi/*.msi

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .deb, .rpm and app image
        # libmpv isn't bundled: the app uses the system's (libmpv2 / mpv-libs)
        run: |
          sudo apt-get install -y rpm
          ./gradlew --no-daemon :desktop:packageReleaseDeb :desktop:packageReleaseRpm :desktop:packageReleaseAppImage
          ver=$(sed -n 's/^app.version=//p' gradle.properties)
          out=desktop/build/compose/binaries/main-release
          cp "$(find $out/deb -name '*.deb' | head -1)" "TubeHaus-$ver-linux-amd64.deb"
          cp "$(find $out/rpm -name '*.rpm' | head -1)" "TubeHaus-$ver-linux-x86_64.rpm"
          app=$(find $out/app -mindepth 1 -maxdepth 1 -type d | head -1)
          tar -C "$(dirname "$app")" -czf "TubeHaus-$ver-linux-x64.tar.gz" "$(basename "$app")"
          ls -la TubeHaus-*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            TubeHaus-*.deb
            TubeHaus-*.rpm
            TubeHaus-*.tar.gz

  mac:
    # Apple Silicon; mpv comes from Homebrew on the user's Mac (brew install mpv), nothing is bundled
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .dmg
        run: |
          # the app icon as .icns, made from the PNG
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s desktop/src/main/resources/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) desktop/src/main/resources/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o desktop/icon.icns
          ./gradlew --no-daemon :desktop:packageReleaseDmg
          ver=$(sed -n 's/^app.version=//p' gradle.properties)
          cp "$(find desktop/build/compose/binaries/main-release/dmg -name '*.dmg' | head -1)" "TubeHaus-$ver-mac-arm64.dmg"
          ls -la TubeHaus-*
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: TubeHaus-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/app-v') || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [android, windows, linux, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # only the desktop files: APKs built here are signed with a throwaway key and could
        # not update the ones already installed, so the APK is always uploaded by hand
        run: |
          files="windows/*.msi mac/*.dmg linux/*.deb linux/*.rpm linux/*.tar.gz"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            # a pre-release, so it never becomes the server's "latest release"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TubeHaus ${GITHUB_REF_NAME#*-v} · Android, Windows, macOS, Linux" \
              --prerelease --latest=false --notes "Android, Windows, macOS and Linux" $files
          fi
